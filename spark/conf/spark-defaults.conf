# =============================================================================
#  spark-defaults.conf  -  valeurs par defaut du cluster Spark de la plateforme
# -----------------------------------------------------------------------------
#  NB : la configuration du catalogue Nessie et des acces MinIO (S3A / S3FileIO)
#  est construite PAR LES JOBS dans spark/jobs/common/spark_session.py a partir
#  des variables d'environnement. Elle est donc propagee automatiquement aux
#  executors via la SparkSession -> rien de sensible n'est fige ici.
# =============================================================================

# --- Journalisation des evenements (Spark UI / History Server) --------------
spark.eventLog.enabled              true
spark.eventLog.dir                  /opt/spark/spark-events
spark.history.fs.logDirectory       /opt/spark/spark-events

# --- Extensions SQL Iceberg + Nessie (toujours actives) --------------------
spark.sql.extensions               org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions

# --- Reglages raisonnables pour un cluster mono-worker de demo ------------
spark.sql.shuffle.partitions       8
spark.sql.adaptive.enabled         true
spark.driver.memory                1g
spark.executor.memory              2g
spark.executor.cores               2
