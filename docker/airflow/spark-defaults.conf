# =============================================================================
#  spark-defaults.conf cote Airflow (driver "client mode").
#  Identique au cluster : le detail catalogue/MinIO est injecte par les jobs
#  (spark/jobs/common/spark_session.py) et propage aux executors.
# =============================================================================

spark.sql.extensions               org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions

spark.sql.shuffle.partitions       8
spark.sql.adaptive.enabled         true
spark.driver.memory                1g
spark.executor.memory              2g
spark.executor.cores               2

# Le driver tourne dans le conteneur airflow-scheduler : il doit etre
# joignable par les executors (worker Spark) via le reseau docker.
spark.driver.bindAddress           0.0.0.0
